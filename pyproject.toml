[project]
name = "mosaic-pathway"
version = "0.1.0"
description = "A small RAG service that generates personalized Mosaic learning pathways for families"
readme = "README.md"
authors = [
    { name = "Shiva Chittamuru", email = "shiva.vy147@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.25.3",
    "fastapi>=0.141.1",
    "openai>=2.50.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.1",
    "streamlit>=1.60.0",
    "uvicorn>=0.52.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mypy>=2.3.0",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
